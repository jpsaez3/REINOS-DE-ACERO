name: Instalador de Windows
on:
  workflow_dispatch:
  push:
    tags:
      - "desktop-v*"
permissions:
  contents: write
jobs:
  installer:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Instalar dependencias y runtime verificado
        run: |
          npm ci --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'Falló la instalación de dependencias' }
          node node_modules/electron/install.js
      - name: Comprobar reglas del juego
        run: npm test
      - name: Comprobar recursos locales
        run: npm run test:desktop-unit
      - name: Crear el instalador con todos los archivos incluidos
        run: npm run desktop:win
      - name: Instalar y comprobar la aplicación real
        shell: pwsh
        run: |
          $installer = Get-ChildItem release/Reinos-de-Acero-Setup-*-x64.exe | Select-Object -First 1
          if (!$installer) { throw 'No se encontró el instalador' }
          $target = Join-Path $env:RUNNER_TEMP 'reinos-instalado'
          $sentinel = Join-Path $env:APPDATA 'Reinos de Acero/installer-preserve-test.txt'
          New-Item -ItemType Directory -Path (Split-Path $sentinel) -Force | Out-Null
          Set-Content -Path $sentinel -Value 'conservar-datos'
          $result = Start-Process -FilePath $installer.FullName -ArgumentList @('/S', "/D=$target") -Wait -PassThru
          if ($result.ExitCode -ne 0) { throw "La instalación falló: $($result.ExitCode)" }
          $env:REINOS_PACKAGED_EXECUTABLE = Join-Path $target 'Reinos de Acero.exe'
          if (!(Test-Path $env:REINOS_PACKAGED_EXECUTABLE)) { throw 'Falta el juego instalado' }
          npm run test:desktop -- --packaged
          if ($LASTEXITCODE -ne 0) { throw 'Falló la prueba de la aplicación instalada' }
          $uninstaller = Get-ChildItem $target -Filter 'Uninstall*.exe' | Select-Object -First 1
          if (!$uninstaller) { throw 'Falta el desinstalador' }
          $result = Start-Process -FilePath $uninstaller.FullName -ArgumentList '/S' -Wait -PassThru
          if ($result.ExitCode -ne 0) { throw 'Falló la desinstalación' }
          if (!(Test-Path $sentinel)) { throw 'El desinstalador eliminó los datos del usuario' }
          Remove-Item $sentinel
      - name: Verificar ejecutable y calcular SHA-256
        run: npm run desktop:checksums
      - name: Conservar instalador
        uses: actions/upload-artifact@v4
        with:
          name: Reinos-de-Acero-Windows
          path: |
            release/Reinos-de-Acero-Setup-*-x64.exe
            release/SHA256SUMS.txt
      - name: Conservar capturas de la prueba
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Prueba-aplicacion-Windows
          path: test-results/desktop-*.png
          if-no-files-found: ignore
      - name: Publicar descarga comprobada
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $installer = Get-ChildItem release/Reinos-de-Acero-Setup-*-x64.exe | Select-Object -First 1
          @'
          Instalador completo para Windows 10/11 de 64 bits. No requiere Node.js, terminal ni conexión para jugar.

          Descarga el archivo Reinos-de-Acero-Setup-…-x64.exe, ábrelo y sigue el asistente en español. Después inicia Reinos de Acero desde el escritorio o el menú Inicio.

          Incluye el prototipo del Paso Ceniza, sus 36 combinaciones ilustradas y el guardado local. Las partidas del navegador no se importan automáticamente. La desinstalación conserva los datos del usuario.

          El instalador todavía no dispone de firma digital de editor; Windows puede mostrar un aviso al abrirlo.

          Esta descarga se publica después de instalar el .exe y comprobar el arranque, los recursos incluidos y la recuperación de partida en Windows. SHA256SUMS.txt permite verificar la integridad del archivo.
          '@ | Set-Content -Path release-notes.txt -Encoding utf8
          gh release create "$env:GITHUB_REF_NAME" $installer.FullName 'release/SHA256SUMS.txt' --title 'Reinos de Acero — instalador Windows' --notes-file release-notes.txt --verify-tag
          if ($LASTEXITCODE -ne 0) { throw 'No se pudo publicar el instalador' }
